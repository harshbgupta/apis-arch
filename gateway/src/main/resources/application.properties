spring.application.name=gateway
server.port=8080
jwt.secret=ODg1ZWFkY2ItZDQ1NS00NzNiLWIwMjAtMzI3YTQ2ZmY5NDZk

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.instance.prefer-ip-address=true

# Gateway Configuration
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

#Discovery server route
#http://localhost:8761
spring.cloud.gateway.mvc.routes[1].id=discovery-server
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8761/
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/eureka/web
spring.cloud.gateway.mvc.routes[1].filters[0]=SetPath=/

# Route configuration for user-services
spring.cloud.gateway.mvc.routes[0].id=user-services
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/user/
